name: Catalogue CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalogue-validation:
    name: catalogue-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py --output dist
      - name: Check JavaScript syntax
        run: find site games -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
      - name: Check deployment shell syntax
        run: bash -n ops/sync-games.sh ops/install-sync.sh
