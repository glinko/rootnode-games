<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d8f5e8">
  <title>Angry Balls</title>
  <link rel="stylesheet" href="style.css?v=12">
  <script defer src="vendor/p5.min.js"></script>
  <script defer src="game.js?v=12"></script>
  <script defer src="editor.js?v=12"></script>
</head>
<body>
  <button id="menu-open" aria-label="Open menu" aria-haspopup="dialog">☰</button>
  <main class="app">
    <div id="editor-top" hidden><input id="level-name" aria-label="Level name" maxlength="48" placeholder="My level"><button id="new-level">New</button><button id="library-open">My levels</button></div>
    <div id="stage"><div id="result" hidden><div class="card"><span id="result-icon">✦</span><h2 id="result-title"></h2><p id="result-copy"></p><button id="again">Try again</button></div></div></div>
    <section id="editor-tools" hidden aria-label="Editor tools">
      <div id="tool-strip" role="group" aria-label="Choose a tool"></div>
      <div id="editor-properties"><label id="brush-control">Brush <input id="brush-size" type="range" min="8" max="60" value="24"><output id="brush-output">24</output></label><label id="object-size-control" hidden>Size <input id="object-size" type="range" min="9" max="36" value="17"><output id="object-size-output">17</output></label><label id="laser-control" hidden>Beam <select id="laser-direction"><option value="left">← Left</option><option value="right">→ Right</option><option value="up">↑ Up</option><option value="down">↓ Down</option></select></label><span id="editor-message" role="status">Draw terrain with your finger</span></div>
      <div class="editor-actions"><button id="editor-undo" aria-label="Undo last action">↶</button><button id="save-level">Save</button><button id="test-level" class="primary">▶ Test</button></div>
    </section>
  </main>
  <dialog id="game-menu" aria-labelledby="page-title"><div class="library-heading"><div><span class="eyebrow">ANGRY BALLS</span><h2 id="page-title">Menu</h2></div><button id="menu-close" aria-label="Close menu">×</button></div><nav class="menu-actions" aria-label="Game actions"><button id="level-picker">Choose level <span id="level">LEVEL 01</span></button><button id="editor-entry">✎ Editor</button><button id="editor-exit" hidden>Back to game</button><button id="restart">↻ Restart</button><a class="catalogue-link" href="/">← Game catalogue</a></nav></dialog>
  <dialog id="level-library"><div class="library-heading"><h2>My levels</h2><button id="library-close" aria-label="Close">×</button></div><p class="library-note">Saving publishes levels in the game. A copy stays in this browser.</p><div id="saved-levels"></div><div class="library-files"><button id="export-level">Export current level</button><button id="import-level">Import file</button></div><input id="import-file" type="file" accept="application/json,.json" hidden><p id="library-message" role="status"></p></dialog>
<dialog id="game-levels"><div class="library-heading"><h2>Level selection</h2><button id="game-levels-close" aria-label="Close">×</button></div><div id="game-level-list"></div><p id="game-level-message" role="status"></p></dialog>
</body>
</html>
